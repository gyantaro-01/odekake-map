<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITパパのお出かけ攻略MAP</title>
    
    <!-- 
      【外部リソース】
      FastAPI(Jinja2)のurl_forを使用して、staticディレクトリ内のCSSを動的に参照。
      キャッシュ対策やパスの不整合を防ぐ指定方法。
    -->
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
</head>
<body>

    <!-- 1. 検索セクション: Google Places Autocomplete用入力エリア -->
    <div id="search-container">
        <input id="pac-input" type="text" placeholder="場所を検索...">
    </div>

    <!-- 2. マップセクション: 地図のレンダリング先 -->
    <div id="map"></div>

    <!-- 3. リストセクション: 攻略済みスポットの動的表示エリア -->
    <div id="list-container">
        <div class="header-flex">
            <h2>📊 攻略済みリスト</h2>
        </div>

        <!-- 並び替えコントロール -->
        <div class="sort-buttons">
            <button class="sort-btn" id="sort-name" onclick="sortTable('name')">名前順</button>
            <button class="sort-btn" id="sort-kids_score" onclick="sortTable('kids_score')">スコア順</button>
        </div>

        <!-- 
          ここに script.js の renderList() によって 
          .log-card エレメントが動的に挿入される
        -->
        <div id="card-list"></div>
    </div>

    <!-- 
      【外部SDK読み込み】
      Google Maps API: main.py から渡された api_key を使用。
      placesライブラリを併用することで、名称検索を可能にしている。
    -->
    <script src="https://maps.googleapis.com/maps/api/js?key={{ api_key }}&libraries=places"></script>

    <!-- 
      【アプリケーションロジック】
      メインの動作を制御する外部JavaScript。
      APIの読み込み完了後に実行されるよう、最後に配置している。
    -->
    <script src="{{ url_for('static', path='js/script.js') }}"></script>

</body>
</html>
